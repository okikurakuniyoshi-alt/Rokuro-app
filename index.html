<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六層運営">
<meta name="theme-color" content="#1e293b">
<title>六層連動操法 運営管理</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
  --txt:#f1f5f9; --sub:#94a3b8; --accent:#38bdf8;
  --seminar:#2563eb; --review:#16a34a; --youtube:#dc2626; --zoom:#7c3aed; --treatment:#ea580c;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
#app{max-width:520px;margin:0 auto;padding-bottom:78px;min-height:100vh;}
header{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);}
header h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
header .date{font-size:12px;color:var(--sub);margin-top:2px;}
.view{padding:14px 14px 24px;display:none;animation:fade .2s;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h2{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px;}
.card h2 .c{width:10px;height:10px;border-radius:3px;display:inline-block;}
.muted{color:var(--sub);font-size:13px;}
.row{display:flex;align-items:center;gap:10px;}
.btn{background:var(--accent);color:#04293f;border:none;border-radius:10px;padding:11px 14px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;}
.btn:active{opacity:.85;}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
.btn.sm{padding:7px 12px;font-size:13px;width:auto;}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ok{background:var(--ok);color:#04331a;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;color:#fff;}
.tag.seminar{background:var(--seminar);}.tag.review{background:var(--review);}
.tag.youtube{background:var(--youtube);}.tag.zoom{background:var(--zoom);}.tag.treatment{background:var(--treatment);}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-size:15px;font-family:inherit;margin-top:4px;}
textarea{min-height:120px;resize:vertical;line-height:1.6;}
label{font-size:12px;color:var(--sub);font-weight:600;}
.field{margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.chk{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--sub);border-radius:7px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:transparent;}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04331a;}
.li-body{flex:1;min-width:0;}
.li-body .t{font-size:14px;font-weight:600;}
.li-body .s{font-size:12px;color:var(--sub);}
.done .t{text-decoration:line-through;color:var(--sub);}
.status-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px;}
.status-seg button{background:transparent;border:none;color:var(--sub);padding:6px 10px;font-size:11px;font-weight:700;
  cursor:pointer;border-right:1px solid var(--line);}
.status-seg button:last-child{border-right:none;}
.status-seg button.on{background:var(--accent);color:#04293f;}
.status-seg button.on.warn{background:var(--warn);color:#3a2400;}
.status-seg button.on.ok{background:var(--ok);color:#04331a;}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,23,42,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:9px 2px 7px;font-size:10px;font-weight:600;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.on{color:var(--accent);}
nav button .ic{font-size:20px;line-height:1;}
.metric{text-align:center;padding:10px;background:var(--panel2);border-radius:12px;}
.metric .v{font-size:22px;font-weight:800;}
.metric .l{font-size:11px;color:var(--sub);margin-top:2px;}
.metric.green .v{color:var(--ok);}.metric.amber .v{color:var(--warn);}.metric.red .v{color:var(--danger);}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0;}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--sub);padding:3px 0;font-weight:700;}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;padding:3px;position:relative;
  display:flex;flex-direction:column;font-size:11px;cursor:pointer;overflow:hidden;background:var(--panel);}
.cal-cell.other{opacity:.35;}
.cal-cell.today{border-color:var(--accent);border-width:2px;}
.cal-cell .dn{font-weight:700;font-size:11px;}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto;}
.cal-dots i{width:6px;height:6px;border-radius:50%;display:block;}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:7px;font-size:13px;font-weight:700;border-radius:8px;}
.seg button.on{background:var(--accent);color:#04293f;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;}
.modal-bg.on{display:flex;}
.modal{background:var(--panel);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto;animation:up .25s;}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.modal h2{margin:0 0 14px;font-size:17px;}
.fab{position:fixed;bottom:84px;right:calc(50% - 250px);z-index:35;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#04293f;border:none;font-size:30px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;}
@media(max-width:520px){.fab{right:18px;}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0b1220;color:#fff;
  border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:60;font-size:13px;font-weight:600;
  opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;}
.toast.on{opacity:1;bottom:108px;}
.divider{height:1px;background:var(--line);margin:12px 0;}
.k{font-size:12px;color:var(--sub);}
small.hint{display:block;color:var(--sub);font-size:11px;margin-top:3px;line-height:1.4;}
.gstat{font-size:12px;padding:6px 10px;border-radius:8px;font-weight:700;display:inline-block;}
.gstat.off{background:#3a1d1d;color:#fca5a5;}.gstat.on{background:#0f3320;color:#86efac;}
.ovd{color:var(--danger);font-weight:700;}
a{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌀 六層連動操法 運営管理 <span id="gdot" style="font-size:11px;"></span></h1>
    <div class="date" id="todayLabel"></div>
  </header>
  <section class="view active" id="view-dash"></section>
  <section class="view" id="view-cal"></section>
  <section class="view" id="view-task"></section>
  <section class="view" id="view-line"></section>
  <section class="view" id="view-sales"></section>
  <section class="view" id="view-more"></section>
</div>

<button class="fab" id="fab" onclick="openAdd()">＋</button>

<nav>
  <button data-v="dash" class="on" onclick="go('dash')"><span class="ic">🏠</span>ホーム</button>
  <button data-v="cal" onclick="go('cal')"><span class="ic">📅</span>カレンダー</button>
  <button data-v="task" onclick="go('task')"><span class="ic">✅</span>タスク</button>
  <button data-v="line" onclick="go('line')"><span class="ic">💬</span>LINE</button>
  <button data-v="sales" onclick="go('sales')"><span class="ic">💰</span>売上</button>
  <button data-v="more" onclick="go('more')"><span class="ic">⚙️</span>その他</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var TYPES = {
  seminar:  {label:'セミナー', color:'#2563eb', gcal:'9'},
  review:   {label:'復習会',   color:'#16a34a', gcal:'10'},
  youtube:  {label:'YouTube',  color:'#dc2626', gcal:'11'},
  zoom:     {label:'Zoom',     color:'#7c3aed', gcal:'3'},
  treatment:{label:'施術',     color:'#ea580c', gcal:'6'}
};
var MARKS = {'◯':26800,'△':16800,'×':0};

var KEY='rokuso_v1';
var DB = load();
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)); if(d) return d;}catch(e){}
  return {events:[],tasks:[],patients:[],settings:{clientId:'',apiKey:'',calendarId:'primary'}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function today(){return ymd(new Date());}
function weekRange(base){
  var d=parseD(base);var wd=(d.getDay()+6)%7;
  var mon=new Date(d);mon.setDate(d.getDate()-wd);
  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return {start:ymd(mon),end:ymd(sun)};
}
function lastWeekRange(){return weekRange(addDays(today(),-7));}
function inRange(date,a,b){return date>=a&&date<=b;}
function monthRange(date){var a=date.split('-').map(Number);var y=a[0],m=a[1];
  return {start:y+'-'+pad(m)+'-01', end:y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate())};}
var DOW=['日','月','火','水','木','金','土'];
function jdate(s){var d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';}
function jdateLong(s){var d=parseD(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+DOW[d.getDay()]+')';}
function zen2han(s){return String(s||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});}
function parseSeminar(title){
  var s=zen2han(title);
  var c=s.match(/([0-9]+)\s*期/);
  var k=s.match(/(?:第)?\s*([0-9]+)\s*回/);
  return {cohort:c?c[1]:'',session:k?k[1]:''};
}
function detectMark(title){
  var ch=(title||'').trim().charAt(0);
  if(ch==='◯'||ch==='○'||ch==='〇'||ch==='O'||ch==='o')return '◯';
  if(ch==='△'||ch==='▲')return '△';
  if(ch==='×'||ch==='✕'||ch==='x'||ch==='X')return '×';
  return null;
}
function stripMark(title){return (title||'').replace(/^[◯○〇△▲×✕xXoO][\s：:]*/,'').trim();}
function reconcileSales(){
  var changed=0;
  DB.events.forEach(function(e){
    if(e.linkPatient)return;
    var mk=detectMark(e.title);
    if(!mk)return;
    e.type='treatment';
    var pid=uid();e.linkPatient=pid;
    DB.patients.push({id:pid,name:stripMark(e.title)||e.title,mark:mk,date:e.date,paid:false});
    changed++;
  });
  return changed;
}
function reconcileSeminarTasks(){
  var changed=0;
  DB.events.forEach(function(e){
    if(e.type!=='seminar')return;
    if(DB.tasks.some(function(t){return t.eventId===e.id;}))return;
    if(!e.cohort||!e.session){var pi=parseSeminar(e.title||'');if(!e.cohort)e.cohort=pi.cohort;if(!e.session)e.session=pi.session;}
    regenSeminarTasks(e);
    changed++;
  });
  return changed;
}

var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2600);}

function seminarGroup(venue,C){
  if(!C) return venue+'（期を入力）';
  if(venue==='大阪'){
    if(C<=3)return '大阪 1〜3期';
    if(C===4)return '大阪 4期';
    if(C===5)return '大阪 5期';
    if(C===6)return '大阪 6期';
    if(C===7)return '大阪 7期';
    if(C===8)return '大阪 8期';
    return '大阪 9期';
  }
  if(C<=4)return '東京 1〜4期';
  if(C<=6)return '東京 5・6期';
  if(C<=8)return '東京 7・8期';
  return '東京 9期';
}
function regenSeminarTasks(ev){
  DB.tasks = DB.tasks.filter(function(t){return t.eventId!==ev.id;});
  if(ev.type!=='seminar') return;
  var D=ev.date, C=Number(ev.cohort)||0, S=Number(ev.session)||0;
  var venue=/大阪/.test(ev.title||'')?'大阪':'東京';
  var sup=(C>=7&&C<=9);
  var S3=['未対応','作成済み','送信済み'];
  function add(label,due,opts,target){DB.tasks.push({id:uid(),eventId:ev.id,label:label,due:due,options:opts,status:opts[0],
    ctx:((ev.cohort?ev.cohort+'期 ':'')+venue+' '+(ev.session?ev.session+'回目':'')).trim(),target:target||''});}
  if(sup) add('予習動画配信案内', addDays(D,-11), S3, '7・8・9期生＋サポーター');
  add('セミナー案内送信', addDays(D,-3), S3, seminarGroup(venue,C)+(sup?'＋サポーター':''));
  if(S===5) add('次期セミナースケジュール案内作成', addDays(D,-3), S3, '');
  if(S===6) add('次期セミナー申込案内', D, S3, '');
  add('セミナー資料添付送付', addDays(D,3), ['未対応','完了'], '');
}
function isSendTask(t){return t.options.indexOf('送信済み')>=0;}

var cur='dash';
function go(v){
  cur=v;
  var views=document.querySelectorAll('.view');for(var i=0;i<views.length;i++)views[i].classList.remove('active');
  document.getElementById('view-'+v).classList.add('active');
  var nbs=document.querySelectorAll('nav button');for(var j=0;j<nbs.length;j++)nbs[j].classList.toggle('on',nbs[j].dataset.v===v);
  document.getElementById('fab').style.display=(v==='line'||v==='more')?'none':'block';
  render();window.scrollTo(0,0);
}
function render(){
  if(cur==='dash')renderDash();
  else if(cur==='cal')renderCal();
  else if(cur==='task')renderTasks();
  else if(cur==='line')renderLine();
  else if(cur==='sales')renderSales();
  else if(cur==='more')renderMore();
}

function renderDash(){
  var T=today();var w=weekRange(T);var lw=lastWeekRange();var mr=monthRange(T);
  var openTasks=DB.tasks.filter(function(t){return t.status!==last(t.options)&&t.status!=='完了';});
  var todayTasks=openTasks.filter(function(t){return t.due<=T;});
  var weekTasks=openTasks.filter(function(t){return inRange(t.due,w.start,w.end);});
  var unsent=DB.tasks.filter(function(t){return isSendTask(t)&&t.status!=='送信済み';});
  function evWeek(tp){return DB.events.filter(function(e){return e.type===tp&&inRange(e.date,w.start,w.end);}).sort(function(a,b){return a.date.localeCompare(b.date);});}
  var lastSales=sumSales(lw.start,lw.end);
  var monthSales=sumSales(mr.start,mr.end);
  var unpaid=DB.patients.filter(function(p){return !p.paid&&MARKS[p.mark]>0;}).length;
  var el=document.getElementById('view-dash');
  el.innerHTML=
  '<div class="card" style="background:linear-gradient(135deg,#1e293b,#0f2942);">'+
    '<h2>📌 最優先：抜け漏れチェック</h2>'+
    '<div class="grid2" style="gap:8px;">'+
      '<div class="metric '+(todayTasks.length?'amber':'green')+'"><div class="v">'+todayTasks.length+'</div><div class="l">今日やること</div></div>'+
      '<div class="metric '+(unsent.length?'red':'green')+'"><div class="v">'+unsent.length+'</div><div class="l">未送信の案内</div></div>'+
    '</div></div>'+
  '<div class="card"><h2>📝 今日やること</h2>'+
    (todayTasks.length?taskListHTML(todayTasks,true):'<div class="empty">今日のタスクはありません 🎉</div>')+'</div>'+
  '<div class="card"><h2>📨 未送信一覧（送っていない案内）</h2>'+
    (unsent.length?unsent.map(function(t){return '<div class="list-item"><div class="li-body"><div class="t">'+esc(t.label)+'</div>'+
      '<div class="s">'+esc(t.ctx||'')+' ・ 期限 '+jdate(t.due)+(t.due<today()?' <span class="ovd">⚠️期限切れ</span>':'')+'</div>'+
      (t.target?'<div class="s" style="color:var(--accent);font-weight:600;">送信先：'+esc(t.target)+'</div>':'')+'</div>'+
      '<button class="btn sm ok" onclick="setTaskStatus(\''+t.id+'\',\'送信済み\')">送信済</button></div>';}).join(''):'<div class="empty">未送信の案内はありません ✅</div>')+'</div>'+
  '<div class="card"><h2>🗓 今週やること</h2>'+
    (weekTasks.length?taskListHTML(weekTasks,false):'<div class="empty">今週のタスクはありません</div>')+'</div>'+
  '<div class="grid2">'+
    weekEventCard('セミナー','seminar',evWeek('seminar'))+
    weekEventCard('復習会','review',evWeek('review'))+
    weekEventCard('Zoom','zoom',evWeek('zoom'))+
    weekEventCard('YouTube','youtube',evWeek('youtube'))+'</div>'+
  '<div class="card"><h2>💰 売上サマリー（毎週月曜チェック）</h2>'+
    '<div class="grid2" style="gap:8px;">'+
      '<div class="metric green"><div class="v">¥'+fmt(lastSales)+'</div><div class="l">先週売上</div></div>'+
      '<div class="metric"><div class="v">¥'+fmt(monthSales)+'</div><div class="l">今月売上</div></div></div>'+
    '<div class="metric '+(unpaid?'red':'green')+'" style="margin-top:8px;"><div class="v">'+unpaid+'件</div><div class="l">未入金件数</div></div></div>';
}
function weekEventCard(name,type,list){
  return '<div class="card" style="margin-bottom:0;">'+
    '<h2><span class="c" style="background:'+TYPES[type].color+'"></span>今週の'+name+'</h2>'+
    (list.length?list.map(function(e){return '<div class="s muted" style="margin-bottom:4px;">'+jdate(e.date)+' '+(e.time||'')+' '+esc(e.title||TYPES[type].label)+'</div>';}).join('')
      :'<div class="muted">予定なし</div>')+'</div>';
}
function taskListHTML(list,showDate){
  return list.sort(function(a,b){return a.due.localeCompare(b.due);}).map(function(t){
    var done=t.status===last(t.options)||t.status==='完了';
    var overdue=!done&&t.due<today();
    var dstr=overdue?'<span class="ovd">⚠️期限切れ '+jdate(t.due)+'</span>':'期限 '+jdate(t.due);
    return '<div class="list-item '+(done?'done':'')+'">'+
      '<div class="chk '+(done?'on':'')+'" onclick="toggleTaskDone(\''+t.id+'\')">'+(done?'✓':'')+'</div>'+
      '<div class="li-body"><div class="t">'+esc(t.label)+'</div>'+
        '<div class="s">'+esc(t.ctx||'')+' ・ '+dstr+'</div>'+
        (t.target?'<div class="s" style="color:var(--accent);font-weight:600;">送信先：'+esc(t.target)+'</div>':'')+
        statusSeg(t)+'</div></div>';}).join('');
}
function statusSeg(t){
  return '<div class="status-seg">'+t.options.map(function(o){
    var on=t.status===o;
    var cls=on?(o==='作成済み'?'on warn':((o==='送信済み'||o==='完了')?'on ok':'on')):'';

function calNav(n){
  if(calMode==='month'){
    var a=calMonth.split('-').map(Number);var y=a[0],m=a[1]+n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}
    calMonth=y+'-'+pad(m);
  }else{calWeekBase=addDays(calWeekBase||today(),n*7);}
  renderCal();
}
function evDots(date){
  return DB.events.filter(function(e){return e.date===date;}).map(function(e){return '<i style="background:'+TYPES[e.type].color+'"></i>';}).join('');
}
function drawMonth(){
  var a=calMonth.split('-').map(Number);var y=a[0],m=a[1];
  document.getElementById('calTitle').textContent=y+'年'+m+'月';
  var first=new Date(y,m-1,1);var startWd=first.getDay();var days=new Date(y,m,0).getDate();
  var cells='';
  for(var i=0;i<7;i++)cells+='<div class="dow">'+DOW[i]+'</div>';
  for(var k=0;k<startWd;k++){var d=new Date(y,m-1,1-startWd+k);cells+=cellHTML(ymd(d),true);}
  for(var dd=1;dd<=days;dd++)cells+=cellHTML(y+'-'+pad(m)+'-'+pad(dd),false);
  var total=startWd+days;var tail=(7-total%7)%7;
  for(var t=1;t<=tail;t++){var d2=new Date(y,m,t);cells+=cellHTML(ymd(d2),true);}
  document.getElementById('calBody').innerHTML='<div class="cal-grid">'+cells+'</div>';
}
function cellHTML(date,other){
  var isToday=date===today();
  return '<div class="cal-cell '+(other?'other':'')+' '+(isToday?'today':'')+'" onclick="dayDetail(\''+date+'\')">'+
    '<span class="dn">'+parseD(date).getDate()+'</span><div class="cal-dots">'+evDots(date)+'</div></div>';
}
function drawWeek(){
  var w=weekRange(calWeekBase||today());
  document.getElementById('calTitle').textContent=jdate(w.start)+' 〜 '+jdate(w.end);
  var html='';
  for(var i=0;i<7;i++){
    var date=addDays(w.start,i);
    var evs=DB.events.filter(function(e){return e.date===date;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
    html+='<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;'+(date===today()?'border-color:var(--accent);':'')+'">'+
      '<div style="font-weight:700;font-size:13px;margin-bottom:6px;">'+jdate(date)+(date===today()?' <span class="pill" style="background:var(--accent);color:#04293f;">今日</span>':'')+'</div>'+
      (evs.length?evs.map(function(e){return '<div class="row" style="margin-bottom:5px;cursor:pointer;" onclick="editEvent(\''+e.id+'\')">'+
        '<span class="tag '+e.type+'">'+TYPES[e.type].label+'</span>'+
        '<span style="font-size:13px;">'+(e.time?e.time+' ':'')+esc(e.title||'')+'</span></div>';}).join('')

  document.getElementById('calBody').innerHTML=html;
}

  var zms=DB.events.filter(function(e){return e.type==='zoom';}).sort(function(a,b){return b.date.localeCompare(a.date);});
  var el=document.getElementById('view-more');
  el.innerHTML=
    '<div class="card"><h2><span class="c" style="background:'+TYPES.youtube.color+'"></span>YouTube管理（月1）</h2>'+
      '<button class="btn sec sm" style="margin-bottom:10px;" onclick="openAdd(null,\'youtube\')">＋ YouTube予定を追加</button>'+
      (yts.length?yts.map(ytCard).join(''):'<div class="empty">まだありません</div>')+'</div>'+
    '<div class="card"><h2><span class="c" style="background:'+TYPES.zoom.color+'"></span>Zoom管理（月3）</h2>'+
      '<button class="btn sec sm" style="margin-bottom:10px;" onclick="openAdd(null,\'zoom\')">＋ Zoom予定を追加</button>'+
      (zms.length?zms.map(zmCard).join(''):'<div class="empty">まだありません</div>')+'</div>'+
    '<div class="card"><h2>☁️ Googleカレンダー連携</h2>'+
      '<div id="gStatus" style="margin-bottom:10px;"></div>'+
      '<button class="btn" onclick="gConnect()">接続 / 認証（取り込み）</button>'+
      '<button class="btn sec" style="margin-top:8px;" onclick="gPull()">Googleから取り込む</button>'+
      '<small class="hint" style="margin-top:8px;">「接続/認証」で自動取り込み＋セミナーのタスク生成＋施術売上反映。大阪はタイトルに「大阪」、東京はそのままでOK。施術は先頭に◯△×。</small>'+
      '<div class="divider"></div>'+
      '<div class="field"><label>OAuth クライアントID</label><input id="setClientId" value="'+esc(DB.settings.clientId)+'" placeholder="xxxx.apps.googleusercontent.com"></div>'+
      '<div class="field"><label>カレンダーID</label><input id="setCalId" value="'+esc(DB.settings.calendarId||'primary')+'" placeholder="primary"></div>'+
      '<button class="btn ok" onclick="saveSettings()">設定を保存</button>'+
      '<small class="hint">クライアントIDのみでOK（APIキー不要）。連携はURL公開時のみ動作します。</small></div>'+
    '<div class="card"><h2>🔧 データ管理</h2>'+
      '<div class="grid2">'+
        '<button class="btn sec" onclick="exportData()">バックアップ書出</button>'+
        '<button class="btn sec" onclick="document.getElementById(\'imp\').click()">復元読込</button></div>'+
      '<input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">'+
      '<small class="hint">データ（編集した文面含む）はこの端末に保存されます。機種変更前にバックアップ書出を推奨。</small></div>';
  updateGStatus();
}
function ytCard(e){
  var c=e.checks||{};
  var items=[['shoot','撮影'],['edit','編集依頼'],['thumb','サムネ作成'],['publish','公開'],['fb','Facebook告知']];
  return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;">'+
    '<div class="row" style="justify-content:space-between;">'+
      '<strong style="font-size:13px;">'+esc(e.title||'YouTube')+'</strong>'+
      '<button class="btn sm sec" onclick="editEvent(\''+e.id+'\')">編集</button></div>'+
    '<div class="s muted">撮影 '+(e.date?jdate(e.date):'-')+' ／ 編集依頼 '+(e.editDate?jdate(e.editDate):'-')+' ／ 公開 '+(e.publishDate?jdate(e.publishDate):'-')+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">'+
      items.map(function(it){return '<button class="btn sm '+(c[it[0]]?'ok':'sec')+'" onclick="toggleCheck(\''+e.id+'\',\''+it[0]+'\')">'+(c[it[0]]?'✓ ':'')+it[1]+'</button>';}).join('')+'</div></div>';
}
function zmCard(e){
  var c=e.checks||{};
  var items=[['invite','案内送信'],['held','開催済み'],['archive','アーカイブ送信']];
  return '<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;">'+
    '<div class="row" style="justify-content:space-between;">'+
      '<strong style="font-size:13px;">'+esc(e.title||'Zoom')+'</strong>'+
      '<button class="btn sm sec" onclick="editEvent(\''+e.id+'\')">編集</button></div>'+
    '<div class="s muted">'+jdate(e.date)+' '+(e.time||'')+' ／ '+esc(e.participants||'参加者未設定')+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">'+
      items.map(function(it){return '<button class="btn sm '+(c[it[0]]?'ok':'sec')+'" onclick="toggleCheck(\''+e.id+'\',\''+it[0]+'\')">'+(c[it[0]]?'✓ ':'')+it[1]+'</button>';}).join('')+'</div></div>';
}
function toggleCheck(id,k){var e=DB.events.find(function(x){return x.id===id;});e.checks=e.checks||{};e.checks[k]=!e.checks[k];save();renderMore();}
function saveSettings(){
  DB.settings.clientId=val('setClientId').trim();
  DB.settings.calendarId=val('setCalId').trim()||'primary';
  save();toast('設定を保存しました ✅');
}
function exportData(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='rokuso_backup_'+today()+'.json';a.click();toast('書き出しました');
}
function importData(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{DB=JSON.parse(r.result);save();toast('復元しました ✅');render();}catch(e){toast('読込に失敗しました');}};
  r.readAsText(f);
}

function openAdd(date,forceType){
  var T=date||today();
  openModal(eventForm({type:forceType||'seminar',date:T,time:'',title:'',cohort:'',session:'',participants:'',editDate:'',publishDate:''},false));
}
function editEvent(id){
  var e=DB.events.find(function(x){return x.id===id;});if(!e)return;
  openModal(eventForm(e,true));
}
function eventForm(e,isEdit){
  return '<h2>'+(isEdit?'予定を編集':'予定を追加')+'</h2>'+
    '<div class="field"><label>種類</label>'+
      '<select id="ev_type" onchange="onTypeChange()">'+
        Object.keys(TYPES).map(function(k){return '<option value="'+k+'" '+(k===e.type?'selected':'')+'>'+TYPES[k].label+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>タイトル（大阪は「大阪」を、施術は先頭に◯△×）</label><input id="ev_title" value="'+esc(e.title||'')+'" placeholder="例：8期 第1回 / 大阪 5期 / ◯ 田中様"></div>'+
    '<div class="grid2">'+
      '<div class="field"><label>日付</label><input type="date" id="ev_date" value="'+(e.date||today())+'"></div>'+
      '<div class="field"><label>時間</label><input id="ev_time" value="'+esc(e.time||'')+'" placeholder="13:00〜"></div></div>'+
    '<div id="ev_seminar" style="display:none;">'+
      '<div class="grid2">'+
        '<div class="field"><label>期（数字）</label><input id="ev_cohort" inputmode="numeric" value="'+esc(e.cohort||'')+'" placeholder="例：8"></div>'+
        '<div class="field"><label>回数（1〜6）</label><input id="ev_session" inputmode="numeric" value="'+esc(e.session||'')+'" placeholder="例：1"></div></div>'+
      '<small class="hint">登録すると 予習動画(7〜9期/11日前)・セミナー案内送信(3日前/送信先自動)・5回目・6回目・資料 のタスクを自動生成。</small></div>'+
    '<div id="ev_yt" style="display:none;">'+
      '<div class="grid2">'+
        '<div class="field"><label>編集依頼日</label><input type="date" id="ev_editDate" value="'+(e.editDate||'')+'"></div>'+
        '<div class="field"><label>公開日</label><input type="date" id="ev_publishDate" value="'+(e.publishDate||'')+'"></div></div></div>'+
    '<div id="ev_zoom" style="display:none;">'+
      '<div class="field"><label>参加者</label><input id="ev_participants" value="'+esc(e.participants||'')+'" placeholder="例：8期生 全員"></div></div>'+
    '<button class="btn" onclick="saveEvent(\''+(isEdit?e.id:'')+'\')">'+(isEdit?'更新':'登録')+'</button>'+
    (isEdit?'<button class="btn danger" style="margin-top:8px;" onclick="deleteEvent(\''+e.id+'\')">削除</button>':'');
}
function onTypeChange(){
  var t=val('ev_type');
  document.getElementById('ev_seminar').style.display=t==='seminar'?'block':'none';
  document.getElementById('ev_yt').style.display=t==='youtube'?'block':'none';
  document.getElementById('ev_zoom').style.display=t==='zoom'?'block':'none';
}
function saveEvent(id){
  var type=val('ev_type');
  var existing=id?DB.events.find(function(e){return e.id===id;}):null;
  var o={type:type,title:val('ev_title').trim(),date:val('ev_date'),time:val('ev_time').trim()};
  if(type==='seminar'){o.cohort=val('ev_cohort').trim();o.session=val('ev_session').trim();}
  if(type==='youtube'){o.editDate=val('ev_editDate');o.publishDate=val('ev_publishDate');o.checks=(existing&&existing.checks)||{};}
  if(type==='zoom'){o.participants=val('ev_participants').trim();o.checks=(existing&&existing.checks)||{};}
  var ev,k;
  if(id){ev=existing;for(k in o)ev[k]=o[k];}
  else{ev={id:uid()};for(k in o)ev[k]=o[k];DB.events.push(ev);}
  if(type==='seminar')regenSeminarTasks(ev);
  save();closeModal();render();toast(id?'更新しました ✅':'登録しました ✅');
  maybePush(ev);
}
function deleteEvent(id){
  var e=DB.events.find(function(x){return x.id===id;});
  DB.events=DB.events.filter(function(x){return x.id!==id;});
  DB.tasks=DB.tasks.filter(function(t){return t.eventId!==id;});
  if(e&&e.linkPatient)DB.patients=DB.patients.filter(function(p){return p.id!==e.linkPatient;});
  if(e&&e.gid)gDelete(e.gid);
  save();closeModal();render();toast('削除しました');
}

function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('on');
  if(document.getElementById('ev_type'))onTypeChange();}
function closeModal(){document.getElementById('modalBg').classList.remove('on');}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){return (n||0).toLocaleString('ja-JP');}
function last(a){return a[a.length-1];}

/* ===== Google Calendar sync (OAuthトークンで直接REST。APIキー不要) ===== */
var gisReady=false,tokenClient=null,gToken=null,gLastError='';
function gErrMsg(e){try{
  if(e&&e.message)return e.message;
  return String(e).slice(0,180);
}catch(_){return '不明なエラー';}}
function loadGoogle(){
  if(document.getElementById('gisjs'))return;
  var s=document.createElement('script');s.id='gisjs';s.src='https://accounts.google.com/gsi/client';
  s.onload=function(){gisReady=true;updateGStatus();};
  document.head.appendChild(s);
}
function gConnect(){
  if(!DB.settings.clientId){toast('先にクライアントIDを保存してください');return;}
  if(!gisReady){toast('Google読込中…数秒後に再度お試しください');loadGoogle();return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:DB.settings.clientId,
    scope:'https://www.googleapis.com/auth/calendar',
    callback:function(resp){
      if(resp&&resp.access_token){gToken=resp;gLastError='';updateGStatus();toast('連携OK。取り込み中…');gPull();}
      else{toast('認証に失敗しました');}
    }});
  tokenClient.requestAccessToken({prompt:gToken?'':'consent'});
}
function gConnected(){return !!(gToken&&gToken.access_token);}
function calId(){return encodeURIComponent(DB.settings.calendarId||'primary');}
function calApi(method,path,body){
  var opt={method:method,headers:{'Authorization':'Bearer '+gToken.access_token}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch('https://www.googleapis.com/calendar/v3'+path,opt).then(function(r){
    if(r.status===204)return {};
    return r.json().then(function(j){
      if(!r.ok){var m=(j&&j.error&&j.error.message)?('['+(j.error.code||r.status)+'] '+j.error.message):('HTTP '+r.status);throw new Error(m);}
      return j;
    });
  });
}
function updateGStatus(){
  var dot=document.getElementById('gdot');
  if(dot)dot.textContent=gConnected()?'🟢':'';
  var s=document.getElementById('gStatus');
  if(s)s.innerHTML=(gConnected()?'<span class="gstat on">接続済み</span>':'<span class="gstat off">未接続（オフラインで利用中）</span>')+
    (gLastError?'<div style="margin-top:8px;color:#fca5a5;font-size:12px;word-break:break-all;line-height:1.5;">⚠️ エラー詳細：'+esc(gLastError)+'</div>':'');
}
function maybePush(ev){if(gConnected()&&ev)gPush(ev);}
var COLOR_BY_TYPE={};Object.keys(TYPES).forEach(function(k){COLOR_BY_TYPE[k]=TYPES[k].gcal;});
function gPush(ev){
  if(!gConnected())return Promise.resolve();
  var body={
    summary:('【'+TYPES[ev.type].label+'】'+(ev.title||'')).trim(),
    colorId:COLOR_BY_TYPE[ev.type],
    start:ev.time?{dateTime:isoStart(ev),timeZone:'Asia/Tokyo'}:{date:ev.date},
    end:ev.time?{dateTime:isoEnd(ev),timeZone:'Asia/Tokyo'}:{date:addDays(ev.date,1)},
    extendedProperties:{private:{rokusoId:ev.id,rokusoType:ev.type}}
  };
  var pr=ev.gid?calApi('PUT','/calendars/'+calId()+'/events/'+ev.gid,body)
               :calApi('POST','/calendars/'+calId()+'/events',body).then(function(res){ev.gid=res.id;save();});
  return pr.catch(function(e){gLastError=gErrMsg(e);updateGStatus();});
}
function gDelete(gid){if(!gConnected())return;calApi('DELETE','/calendars/'+calId()+'/events/'+gid).catch(function(){});}
function isoStart(ev){var hm=(ev.time.match(/(\d{1,2}):(\d{2})/)||[]);var h=hm[1]?pad(hm[1]):'09';var m=hm[2]||'00';return ev.date+'T'+h+':'+m+':00';}
function isoEnd(ev){var s=isoStart(ev);var d=new Date(s);d.setHours(d.getHours()+1);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00';}
function gSyncAll(){
  if(!gConnected()){toast('先に接続してください');return;}
  if(!DB.events.length){toast('アプリに予定がありません');return;}
  toast('同期中…');
  var chain=Promise.resolve();
  DB.events.forEach(function(ev){chain=chain.then(function(){return gPush(ev);});});
  chain.then(function(){if(gLastError)toast('同期失敗：'+gLastError);else toast('Googleへ同期しました ✅');updateGStatus();});
}
function gPull(){
  if(!gConnected()){toast('先に接続してください');return;}
  var T=new Date();var min=new Date(T);min.setMonth(min.getMonth()-1);var max=new Date(T);max.setMonth(max.getMonth()+3);
  var q='?timeMin='+encodeURIComponent(min.toISOString())+'&timeMax='+encodeURIComponent(max.toISOString())+'&singleEvents=true&maxResults=250&orderBy=startTime';
  calApi('GET','/calendars/'+calId()+'/events'+q).then(function(res){
    var items=(res.items||[]);var n=0;var tg=0;
    items.forEach(function(g){
      var rid=g.extendedProperties&&g.extendedProperties.private?g.extendedProperties.private.rokusoId:null;
      if(rid&&DB.events.find(function(e){return e.id===rid;}))return;
      if(DB.events.find(function(e){return e.gid===g.id;}))return;
      var type=guessType(g);
      var date=(g.start.date||g.start.dateTime||'').slice(0,10);if(!date)return;
      var time=g.start.dateTime?g.start.dateTime.slice(11,16):'';
      var ne={id:uid(),gid:g.id,type:type,title:(g.summary||'').replace(/^【.*?】/,'').trim(),date:date,time:time};
      if(type==='seminar'){var pi=parseSeminar(g.summary||'');ne.cohort=pi.cohort;ne.session=pi.session;}
      DB.events.push(ne);n++;
      if(ne.type==='seminar'){regenSeminarTasks(ne);tg++;}
    });
    var sg=reconcileSales();reconcileSeminarTasks();
    gLastError='';updateGStatus();save();render();
    toast(n+'件取り込み'+(tg?'／セミナー'+tg:'')+(sg?'／施術'+sg+'件を売上反映':'')+' ✅');
  }).catch(function(e){if(window.console)console.warn(e);gLastError=gErrMsg(e);updateGStatus();toast('取り込み失敗：'+gLastError);});
}
function guessType(g){
  var t=g.extendedProperties&&g.extendedProperties.private?g.extendedProperties.private.rokusoType:null;
  if(t&&TYPES[t])return t;
  var s=(g.summary||'');
  if(detectMark(s))return 'treatment';
  var keys=Object.keys(COLOR_BY_TYPE);
  for(var i=0;i<keys.length;i++){if(COLOR_BY_TYPE[keys[i]]===g.colorId)return keys[i];}
  if(/セミナー|六層/.test(s))return 'seminar';if(/復習/.test(s))return 'review';
  if(/youtube|ユーチューブ|撮影|配信/i.test(s))return 'youtube';if(/zoom|ズーム/i.test(s))return 'zoom';
  return 'treatment';
}

function setTodayLabel(){var d=new Date();
  document.getElementById('todayLabel').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';}
setTodayLabel();
if(reconcileSales()+reconcileSeminarTasks()>0)save();
loadGoogle();
go('dash');
