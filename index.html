<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六層運営">
<meta name="theme-color" content="#1e293b">
<title>六層連動操法 運営管理</title>
<style>
:root{
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
  --txt:#f1f5f9; --sub:#94a3b8; --accent:#38bdf8;
  --seminar:#2563eb; --review:#16a34a; --youtube:#dc2626; --zoom:#7c3aed; --treatment:#ea580c;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;}
#app{max-width:520px;margin:0 auto;padding-bottom:78px;min-height:100vh;}
header{position:sticky;top:0;z-index:30;background:rgba(15,23,42,.92);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);}
header h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
header .date{font-size:12px;color:var(--sub);margin-top:2px;}
.view{padding:14px 14px 24px;display:none;animation:fade .2s;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card h2{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--txt);display:flex;align-items:center;gap:7px;}
.card h2 .c{width:10px;height:10px;border-radius:3px;display:inline-block;}
.muted{color:var(--sub);font-size:13px;}
.row{display:flex;align-items:center;gap:10px;}
.btn{background:var(--accent);color:#04293f;border:none;border-radius:10px;padding:11px 14px;font-size:15px;
  font-weight:700;cursor:pointer;width:100%;}
.btn:active{opacity:.85;}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
.btn.sm{padding:7px 12px;font-size:13px;width:auto;}
.btn.danger{background:var(--danger);color:#fff;}
.btn.ok{background:var(--ok);color:#04331a;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;color:#fff;}
.tag.seminar{background:var(--seminar);}.tag.review{background:var(--review);}
.tag.youtube{background:var(--youtube);}.tag.zoom{background:var(--zoom);}.tag.treatment{background:var(--treatment);}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px;font-size:15px;font-family:inherit;margin-top:4px;}
textarea{min-height:120px;resize:vertical;line-height:1.6;}
label{font-size:12px;color:var(--sub);font-weight:600;}
.field{margin-bottom:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.list-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.chk{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--sub);border-radius:7px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;color:transparent;}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04331a;}
.li-body{flex:1;min-width:0;}
.li-body .t{font-size:14px;font-weight:600;}
.li-body .s{font-size:12px;color:var(--sub);}
.done .t{text-decoration:line-through;color:var(--sub);}
.status-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px;}
.status-seg button{background:transparent;border:none;color:var(--sub);padding:6px 10px;font-size:11px;font-weight:700;
  cursor:pointer;border-right:1px solid var(--line);}
.status-seg button:last-child{border-right:none;}
.status-seg button.on{background:var(--accent);color:#04293f;}
.status-seg button.on.warn{background:var(--warn);color:#3a2400;}
.status-seg button.on.ok{background:var(--ok);color:#04331a;}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,23,42,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;background:none;border:none;color:var(--sub);padding:9px 2px 7px;font-size:10px;font-weight:600;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button.on{color:var(--accent);}
nav button .ic{font-size:20px;line-height:1;}
.metric{text-align:center;padding:10px;background:var(--panel2);border-radius:12px;}
.metric .v{font-size:22px;font-weight:800;}
.metric .l{font-size:11px;color:var(--sub);margin-top:2px;}
.metric.green .v{color:var(--ok);}.metric.amber .v{color:var(--warn);}.metric.red .v{color:var(--danger);}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0;}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-grid .dow{text-align:center;font-size:11px;color:var(--sub);padding:3px 0;font-weight:700;}
.cal-cell{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;padding:3px;position:relative;
  display:flex;flex-direction:column;font-size:11px;cursor:pointer;overflow:hidden;background:var(--panel);}
.cal-cell.other{opacity:.35;}
.cal-cell.today{border-color:var(--accent);border-width:2px;}
.cal-cell .dn{font-weight:700;font-size:11px;}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto;}
.cal-dots i{width:6px;height:6px;border-radius:50%;display:block;}
.seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:7px;font-size:13px;font-weight:700;border-radius:8px;}
.seg button.on{background:var(--accent);color:#04293f;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;}
.modal-bg.on{display:flex;}
.modal{background:var(--panel);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow-y:auto;animation:up .25s;}
@keyframes up{from{transform:translateY(40px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
.modal h2{margin:0 0 14px;font-size:17px;}
.fab{position:fixed;bottom:84px;right:calc(50% - 250px);z-index:35;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#04293f;border:none;font-size:30px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;}
@media(max-width:520px){.fab{right:18px;}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0b1220;color:#fff;
  border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:60;font-size:13px;font-weight:600;
  opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;bottom:108px;}
.divider{height:1px;background:var(--line);margin:12px 0;}
.k{font-size:12px;color:var(--sub);}
small.hint{display:block;color:var(--sub);font-size:11px;margin-top:3px;line-height:1.4;}
.gstat{font-size:12px;padding:6px 10px;border-radius:8px;font-weight:700;display:inline-block;}
.gstat.off{background:#3a1d1d;color:#fca5a5;}.gstat.on{background:#0f3320;color:#86efac;}
a{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌀 六層連動操法 運営管理 <span id="gdot" style="font-size:11px;"></span></h1>
    <div class="date" id="todayLabel"></div>
  </header>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dash"></section>
  <!-- CALENDAR -->
  <section class="view" id="view-cal"></section>
  <!-- TASKS -->
  <section class="view" id="view-task"></section>
  <!-- LINE -->
  <section class="view" id="view-line"></section>
  <!-- SALES -->
  <section class="view" id="view-sales"></section>
  <!-- MORE (youtube/zoom/settings) -->
  <section class="view" id="view-more"></section>
</div>

<button class="fab" id="fab" onclick="openAdd()">＋</button>

<nav>
  <button data-v="dash" class="on" onclick="go('dash')"><span class="ic">🏠</span>ホーム</button>
  <button data-v="cal" onclick="go('cal')"><span class="ic">📅</span>カレンダー</button>
  <button data-v="task" onclick="go('task')"><span class="ic">✅</span>タスク</button>
  <button data-v="line" onclick="go('line')"><span class="ic">💬</span>LINE</button>
  <button data-v="sales" onclick="go('sales')"><span class="ic">💰</span>売上</button>
  <button data-v="more" onclick="go('more')"><span class="ic">⚙️</span>その他</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   六層連動操法 運営管理アプリ  (single-file PWA)
   データはこの端末(localStorage)に保存。Google連携は設定から。
   ============================================================ */

const TYPES = {
  seminar:  {label:'セミナー', color:'#2563eb', gcal:'9'},
  review:   {label:'復習会',   color:'#16a34a', gcal:'10'},
  youtube:  {label:'YouTube',  color:'#dc2626', gcal:'11'},
  zoom:     {label:'Zoom',     color:'#7c3aed', gcal:'3'},
  treatment:{label:'施術',     color:'#ea580c', gcal:'6'},
};
const MARKS = {'◯':26800,'△':16800,'×':0};

/* ---------- storage ---------- */
const KEY='rokuso_v1';
let DB = load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)); if(d) return d;}catch(e){}
  return {events:[],tasks:[],patients:[],settings:{clientId:'',apiKey:'',calendarId:'primary'}};
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ---------- date helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function today(){return ymd(new Date());}
function weekRange(base){ // Monday..Sunday containing base
  const d=parseD(base);const wd=(d.getDay()+6)%7;
  const mon=new Date(d);mon.setDate(d.getDate()-wd);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return {start:ymd(mon),end:ymd(sun)};
}
function lastWeekRange(){const w=weekRange(addDays(today(),-7));return w;}
function inRange(date,a,b){return date>=a&&date<=b;}
function monthRange(date){const[y,m]=date.split('-').map(Number);
  return {start:`${y}-${pad(m)}-01`, end:`${y}-${pad(m)}-${pad(new Date(y,m,0).getDate())}`};}
const DOW=['日','月','火','水','木','金','土'];
function jdate(s){const d=parseD(s);return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]})`;}

/* ---------- toast ---------- */
let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}

/* ============================================================
   SEMINAR AUTO-TASK ENGINE
   ============================================================ */
function regenSeminarTasks(ev){
  DB.tasks = DB.tasks.filter(t=>t.eventId!==ev.id); // clear old
  if(ev.type!=='seminar') return;
  const D=ev.date, C=Number(ev.cohort)||0, S=Number(ev.session)||0;
  const S3=['未対応','作成済み','送信済み'];
  const add=(label,due,opts)=>DB.tasks.push({
    id:uid(),eventId:ev.id,label,due,options:opts,status:opts[0],
    ctx:`${ev.cohort?ev.cohort+'期 ':''}${ev.session?ev.session+'回目 ':''}${ev.title||''}`.trim()});
  add('予習動画配信案内', addDays(D,-11), S3);
  add('セミナー生案内送信', addDays(D,-3), S3);
  if(C>=7) add('サポーター案内送信（7〜9期）', addDays(D,-3), S3);
  if(S===5) add('次期セミナースケジュール案内作成', addDays(D,-3), S3);
  if(S===6) add('次期セミナー申込案内', D, S3);
  add('セミナー資料添付送付', addDays(D,3), ['未対応','完了']);
}
/* events that represent "案内送信" tasks (for 未送信一覧) */
function isSendTask(t){return t.options.includes('送信済み');}

/* ============================================================
   ROUTER
   ============================================================ */
let cur='dash';
function go(v){
  cur=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('fab').style.display = (v==='line'||v==='more')?'none':'block';
  render();
  window.scrollTo(0,0);
}
function render(){
  if(cur==='dash')renderDash();
  else if(cur==='cal')renderCal();
  else if(cur==='task')renderTasks();
  else if(cur==='line')renderLine();
  else if(cur==='sales')renderSales();
  else if(cur==='more')renderMore();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDash(){
  const T=today();
  const w=weekRange(T);
  const lw=lastWeekRange();
  const mr=monthRange(T);

  // tasks
  const openTasks=DB.tasks.filter(t=>t.status!==last(t.options)&&t.status!=='完了');
  const todayTasks=openTasks.filter(t=>t.due<=T);
  const weekTasks=openTasks.filter(t=>inRange(t.due,w.start,w.end));
  const unsent=DB.tasks.filter(t=>isSendTask(t)&&t.status!=='送信済み');

  // events this week by type
  const evWeek=t=>DB.events.filter(e=>e.type===t&&inRange(e.date,w.start,w.end)).sort((a,b)=>a.date.localeCompare(b.date));

  // sales
  const lastSales=sumSales(lw.start,lw.end);
  const monthSales=sumSales(mr.start,mr.end);
  const unpaid=DB.patients.filter(p=>!p.paid&&MARKS[p.mark]>0).length;

  const el=document.getElementById('view-dash');
  el.innerHTML=`
  <div class="card" style="background:linear-gradient(135deg,#1e293b,#0f2942);">
    <h2>📌 最優先：抜け漏れチェック</h2>
    <div class="grid2" style="gap:8px;">
      <div class="metric ${todayTasks.length?'amber':'green'}"><div class="v">${todayTasks.length}</div><div class="l">今日やること</div></div>
      <div class="metric ${unsent.length?'red':'green'}"><div class="v">${unsent.length}</div><div class="l">未送信の案内</div></div>
    </div>
  </div>

  <div class="card">
    <h2>📝 今日やること</h2>
    ${todayTasks.length?taskListHTML(todayTasks,true):'<div class="empty">今日のタスクはありません 🎉</div>'}
  </div>

  <div class="card">
    <h2>📨 未送信一覧（送っていない案内）</h2>
    ${unsent.length?unsent.map(t=>`
      <div class="list-item">
        <div class="li-body"><div class="t">${esc(t.label)}</div>
        <div class="s">${esc(t.ctx||'')} ・ 期限 ${jdate(t.due)}</div></div>
        <button class="btn sm ok" onclick="setTaskStatus('${t.id}','送信済み')">送信済</button>
      </div>`).join(''):'<div class="empty">未送信の案内はありません ✅</div>'}
  </div>

  <div class="card">
    <h2>🗓 今週やること</h2>
    ${weekTasks.length?taskListHTML(weekTasks,false):'<div class="empty">今週のタスクはありません</div>'}
  </div>

  <div class="grid2">
    ${weekEventCard('セミナー','seminar',evWeek('seminar'))}
    ${weekEventCard('復習会','review',evWeek('review'))}
    ${weekEventCard('Zoom','zoom',evWeek('zoom'))}
    ${weekEventCard('YouTube','youtube',evWeek('youtube'))}
  </div>

  <div class="card">
    <h2>💰 売上サマリー（毎週月曜チェック）</h2>
    <div class="grid2" style="gap:8px;">
      <div class="metric green"><div class="v">¥${fmt(lastSales)}</div><div class="l">先週売上</div></div>
      <div class="metric"><div class="v">¥${fmt(monthSales)}</div><div class="l">今月売上</div></div>
    </div>
    <div class="metric ${unpaid?'red':'green'}" style="margin-top:8px;"><div class="v">${unpaid}件</div><div class="l">未入金件数</div></div>
  </div>`;
}
function weekEventCard(name,type,list){
  return `<div class="card" style="margin-bottom:0;">
    <h2><span class="c" style="background:${TYPES[type].color}"></span>今週の${name}</h2>
    ${list.length?list.map(e=>`<div class="s muted" style="margin-bottom:4px;">${jdate(e.date)} ${e.time||''} ${esc(e.title||TYPES[type].label)}</div>`).join('')
      :'<div class="muted">予定なし</div>'}
  </div>`;
}
function taskListHTML(list,showDate){
  return list.sort((a,b)=>a.due.localeCompare(b.due)).map(t=>{
    const done = t.status===last(t.options)||t.status==='完了';
    return `<div class="list-item ${done?'done':''}">
      <div class="chk ${done?'on':''}" onclick="toggleTaskDone('${t.id}')">${done?'✓':''}</div>
      <div class="li-body">
        <div class="t">${esc(t.label)}</div>
        <div class="s">${esc(t.ctx||'')}${showDate?' ・ '+jdate(t.due):' ・ 期限 '+jdate(t.due)}</div>
        ${statusSeg(t)}
      </div>
    </div>`;}).join('');
}
function statusSeg(t){
  return `<div class="status-seg">`+t.options.map(o=>{
    const on=t.status===o;
    const cls = on?(o==='作成済み'?'on warn':(o==='送信済み'||o==='完了'?'on ok':'on')):'';
    return `<button class="${cls}" onclick="setTaskStatus('${t.id}','${o}')">${o}</button>`;
  }).join('')+`</div>`;}

/* ============================================================
   CALENDAR
   ============================================================ */
let calMonth = today().slice(0,7); // YYYY-MM
let calMode='month';
function renderCal(){
  const el=document.getElementById('view-cal');
  el.innerHTML=`
    <div class="seg">
      <button class="${calMode==='month'?'on':''}" onclick="calMode='month';renderCal()">月表示</button>
      <button class="${calMode==='week'?'on':''}" onclick="calMode='week';renderCal()">週表示</button>
    </div>
    <div class="card">
      <div class="cal-head">
        <button class="btn sec sm" onclick="calNav(-1)">‹</button>
        <strong id="calTitle"></strong>
        <button class="btn sec sm" onclick="calNav(1)">›</button>
      </div>
      <div id="calBody"></div>
    </div>
    <div class="card">
      <strong style="font-size:13px;">凡例</strong>
      <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px;">
        ${Object.entries(TYPES).map(([k,v])=>`<span class="tag ${k}">${v.label}</span>`).join('')}
      </div>
    </div>`;
  if(calMode==='month')drawMonth();else drawWeek();
}
function calNav(n){
  if(calMode==='month'){
    let[y,m]=calMonth.split('-').map(Number);m+=n;if(m<1){m=12;y--;}if(m>12){m=1;y++;}
    calMonth=`${y}-${pad(m)}`;
  }else{calWeekBase=addDays(calWeekBase||today(),n*7);}
  renderCal();
}
function evDots(date){
  return DB.events.filter(e=>e.date===date).map(e=>`<i style="background:${TYPES[e.type].color}"></i>`).join('');
}
function drawMonth(){
  const[y,m]=calMonth.split('-').map(Number);
  document.getElementById('calTitle').textContent=`${y}年${m}月`;
  const first=new Date(y,m-1,1);const startWd=first.getDay();
  const days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<7;i++)cells+=`<div class="dow">${DOW[i]}</div>`;
  for(let i=0;i<startWd;i++){const d=new Date(y,m-1,1-startWd+i);cells+=cellHTML(ymd(d),true);}
  for(let d=1;d<=days;d++)cells+=cellHTML(`${y}-${pad(m)}-${pad(d)}`,false);
  const total=startWd+days;const tail=(7-total%7)%7;
  for(let i=1;i<=tail;i++){const d=new Date(y,m,i);cells+=cellHTML(ymd(d),true);}
  document.getElementById('calBody').innerHTML=`<div class="cal-grid">${cells}</div>`;
}
function cellHTML(date,other){
  const isToday=date===today();
  return `<div class="cal-cell ${other?'other':''} ${isToday?'today':''}" onclick="dayDetail('${date}')">
    <span class="dn">${parseD(date).getDate()}</span>
    <div class="cal-dots">${evDots(date)}</div>

let calWeekBase=null;
function drawWeek(){
  const w=weekRange(calWeekBase||today());
  document.getElementById('calTitle').textContent=`${jdate(w.start)} 〜 ${jdate(w.end)}`;
  let html='';
  for(let i=0;i<7;i++){
    const date=addDays(w.start,i);
    const evs=DB.events.filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    html+=`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;${date===today()?'border-color:var(--accent);':''}">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;">${jdate(date)}${date===today()?' <span class="pill" style="background:var(--accent);color:#04293f;">今日</span>':''}</div>
      ${evs.length?evs.map(e=>`<div class="row" style="margin-bottom:5px;cursor:pointer;" onclick="editEvent('${e.id}')">
        <span class="tag ${e.type}">${TYPES[e.type].label}</span>
        <span style="font-size:13px;">${e.time?e.time+' ':''}${esc(e.title||'')}</span></div>`).join('')
        :'<div class="muted">予定なし</div>'}
    </div>`;
  }
  document.getElementById('calBody').innerHTML=html;
}
function dayDetail(date){
  const evs=DB.events.filter(e=>e.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const tasks=DB.tasks.filter(t=>t.due===date);
  openModal(`<h2>${jdate(date)}</h2>
    <div class="k" style="margin-bottom:6px;">予定</div>
    ${evs.length?evs.map(e=>`<div class="list-item"><div class="li-body">
      <div class="t"><span class="tag ${e.type}">${TYPES[e.type].label}</span> ${esc(e.title||'')}</div>
      <div class="s">${e.time||''} ${e.cohort?e.cohort+'期':''} ${e.session?e.session+'回目':''}</div></div>

let taskFilter='open';
function renderTasks(){
  const el=document.getElementById('view-task');
  let list=[...DB.tasks];
  if(taskFilter==='open')list=list.filter(t=>t.status!==last(t.options)&&t.status!=='完了');
  if(taskFilter==='today')list=list.filter(t=>t.due<=today()&&t.status!==last(t.options)&&t.status!=='完了');
  if(taskFilter==='done')list=list.filter(t=>t.status===last(t.options)||t.status==='完了');
  list.sort((a,b)=>a.due.localeCompare(b.due));
  el.innerHTML=`
    <div class="seg">
      <button class="${taskFilter==='today'?'on':''}" onclick="taskFilter='today';renderTasks()">今日</button>
      <button class="${taskFilter==='open'?'on':''}" onclick="taskFilter='open';renderTasks()">未完了</button>
      <button class="${taskFilter==='done'?'on':''}" onclick="taskFilter='done';renderTasks()">完了済</button>
    </div>
    <div class="card">
      <h2>✅ タスク（${list.length}件）</h2>
      ${list.length?taskListHTML(list,true):'<div class="empty">該当タスクはありません</div>'}
    </div>
    <div class="muted" style="text-align:center;font-size:12px;">セミナーを登録すると関連タスクが自動生成されます</div>`;
}
function toggleTaskDone(id){
  const t=DB.tasks.find(x=>x.id===id);if(!t)return;
  const done=last(t.options);
  t.status = (t.status===done)?t.options[0]:done;
  save();render();
}
function setTaskStatus(id,s){const t=DB.tasks.find(x=>x.id===id);if(!t)return;t.status=s;save();render();
  if(s==='送信済み'||s==='完了')toast('更新しました ✅');}

function sumSales(a,b){return DB.patients.filter(p=>inRange(p.date,a,b)).reduce((s,p)=>s+(MARKS[p.mark]||0),0);}
function renderSales(){
  const T=today();const w=weekRange(T);const lw=lastWeekRange();const mr=monthRange(T);
  const dayS=sumSales(T,T),weekS=sumSales(w.start,w.end),lastS=sumSales(lw.start,lw.end),monthS=sumSales(mr.start,mr.end);
  const unpaid=DB.patients.filter(p=>!p.paid&&MARKS[p.mark]>0);
  const recent=[...DB.patients].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  const el=document.getElementById('view-sales');
  el.innerHTML=`
    <div class="card">
      <h2>💰 売上集計</h2>
      <div class="grid2" style="gap:8px;">
        <div class="metric"><div class="v">¥${fmt(dayS)}</div><div class="l">本日</div></div>
        <div class="metric"><div class="v">¥${fmt(weekS)}</div><div class="l">今週</div></div>
        <div class="metric green"><div class="v">¥${fmt(lastS)}</div><div class="l">先週</div></div>
        <div class="metric"><div class="v">¥${fmt(monthS)}</div><div class="l">今月</div></div>
      </div>
      <div class="metric ${unpaid.length?'red':'green'}" style="margin-top:8px;">
        <div class="v">${unpaid.length}件 / ¥${fmt(unpaid.reduce((s,p)=>s+MARKS[p.mark],0))}</div><div class="l">未入金</div></div>
    </div>
    <div class="card">
      <h2>＋ 施術を登録</h2>
      <div class="field"><label>患者名</label><input id="pName" placeholder="例：田中様"></div>
      <div class="field"><label>記号（金額）</label>
        <select id="pMark"><option value="◯">◯ = 26,800円</option><option value="△">△ = 16,800円</option><option value="×">× = 0円</option></select></div>
      <div class="grid2">
        <div class="field"><label>日付</label><input type="date" id="pDate" value="${T}"></div>
        <div class="field"><label>入金</label><select id="pPaid"><option value="yes">入金済</option><option value="no" selected>未入金</option></select></div>
      </div>
      <button class="btn" onclick="addPatient()">登録（カレンダーにも反映）</button>
    </div>
    <div class="card">
      <h2>📋 施術履歴</h2>
      ${recent.length?recent.map(p=>`<div class="list-item">
        <div class="li-body"><div class="t">${esc(p.mark)} ${esc(p.name)} <span class="muted">¥${fmt(MARKS[p.mark])}</span></div>
        <div class="s">${jdate(p.date)} ・ ${p.paid?'<span style="color:var(--ok)">入金済</span>':'<span style="color:var(--danger)">未入金</span>'}</div></div>
        <div style="display:flex;gap:6px;">
          <button class="btn sm ${p.paid?'sec':'ok'}" onclick="togglePaid('${p.id}')">${p.paid?'未入金に':'入金済に'}</button>
          <button class="btn sm danger" onclick="delPatient('${p.id}')">削除</button>
        </div></div>`).join(''):'<div class="empty">まだ登録がありません</div>'}
    </div>`;
}
function addPatient(){
  const name=val('pName').trim();if(!name){toast('患者名を入力してください');return;}
  const mark=val('pMark'),date=val('pDate'),paid=val('pPaid')==='yes';
  const id=uid();
  DB.patients.push({id,name,mark,date,paid});
  // also create treatment event on calendar
  DB.events.push({id:'tx_'+id,linkPatient:id,type:'treatment',title:`${mark} ${name}`,date,time:''});
  save();renderSales();toast('登録しました ✅');maybePush(DB.events.find(e=>e.id==='tx_'+id));
}
function togglePaid(id){const p=DB.patients.find(x=>x.id===id);p.paid=!p.paid;save();renderSales();}
function delPatient(id){
  DB.patients=DB.patients.filter(p=>p.id!==id);
  DB.events=DB.events.filter(e=>e.linkPatient!==id);
  save();renderSales();toast('削除しました');
}

      <div class="field"><label>時間</label><input id="ev_time" value="${esc(e.time||'')}" placeholder="13:00〜"></div>
    </div>
    <div id="ev_seminar" style="display:none;">
      <div class="grid2">
        <div class="field"><label>期（数字）</label><input id="ev_cohort" inputmode="numeric" value="${esc(e.cohort||'')}" placeholder="例：8"></div>
        <div class="field"><label>回数（1〜6）</label><input id="ev_session" inputmode="numeric" value="${esc(e.session||'')}" placeholder="例：1"></div>
      </div>
      <small class="hint">登録すると 11日前/3日前/サポーター(7〜9期)/5回目/6回目/資料送付 のタスクを自動生成します。</small>
    </div>
    <div id="ev_yt" style="display:none;">
      <div class="grid2">
        <div class="field"><label>編集依頼日</label><input type="date" id="ev_editDate" value="${e.editDate||''}"></div>
        <div class="field"><label>公開日</label><input type="date" id="ev_publishDate" value="${e.publishDate||''}"></div>
      </div>
    </div>
    <div id="ev_zoom" style="display:none;">
      <div class="field"><label>参加者</label><input id="ev_participants" value="${esc(e.participants||'')}" placeholder="例：8期生 全員"></div>
    </div>
    <button class="btn" onclick="saveEvent('${isEdit?e.id:''}')">${isEdit?'更新':'登録'}</button>
    ${isEdit?`<button class="btn danger" style="margin-top:8px;" onclick="deleteEvent('${e.id}')">削除</button>`:''}`;
}
function onTypeChange(){
  const t=val('ev_type');
  document.getElementById('ev_seminar').style.display = t==='seminar'?'block':'none';
  document.getElementById('ev_yt').style.display = t==='youtube'?'block':'none';
  document.getElementById('ev_zoom').style.display = t==='zoom'?'block':'none';
}
function saveEvent(id){
  const type=val('ev_type');
  const o={type,title:val('ev_title').trim(),date:val('ev_date'),time:val('ev_time').trim()};
  if(type==='seminar'){o.cohort=val('ev_cohort').trim();o.session=val('ev_session').trim();}
  if(type==='youtube'){o.editDate=val('ev_editDate');o.publishDate=val('ev_publishDate');o.checks=(id&&DB.events.find(e=>e.id===id)?.checks)||{};}
  if(type==='zoom'){o.participants=val('ev_participants').trim();o.checks=(id&&DB.events.find(e=>e.id===id)?.checks)||{};}
  let ev;
  if(id){ev=DB.events.find(e=>e.id===id);Object.assign(ev,o);}
  else{ev={id:uid(),...o};DB.events.push(ev);}
  if(type==='seminar')regenSeminarTasks(ev);
  save();closeModal();render();toast(id?'更新しました ✅':'登録しました ✅');
  maybePush(ev);
}
function deleteEvent(id){
  const e=DB.events.find(x=>x.id===id);
  DB.events=DB.events.filter(x=>x.id!==id);
  DB.tasks=DB.tasks.filter(t=>t.eventId!==id);
  if(e&&e.linkPatient)DB.patients=DB.patients.filter(p=>p.id!==e.linkPatient);
  if(e&&e.gid)gDelete(e.gid);
  save();closeModal();render();toast('削除しました');
}

/* ============================================================
   MODAL / UTIL
   ============================================================ */
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('on');
  if(document.getElementById('ev_type'))onTypeChange();}
function closeModal(){document.getElementById('modalBg').classList.remove('on');}
function val(id){const e=document.getElementById(id);return e?e.value:'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return (n||0).toLocaleString('ja-JP');}
function last(a){return a[a.length-1];}

/* ============================================================
   GOOGLE CALENDAR SYNC  (GIS + gapi)
   ============================================================ */
let gapiReady=false,gisReady=false,tokenClient=null,gToken=null;
function loadGoogle(){
  if(document.getElementById('gapijs'))return;
  const s1=document.createElement('script');s1.id='gapijs';s1.src='https://apis.google.com/js/api.js';
  s1.onload=()=>gapi.load('client',()=>{gapiReady=true;updateGStatus();});
  document.head.appendChild(s1);
  const s2=document.createElement('script');s2.src='https://accounts.google.com/gsi/client';
  s2.onload=()=>{gisReady=true;updateGStatus();};
  document.head.appendChild(s2);
}
async function gInitClient(){
  await gapi.client.init({apiKey:DB.settings.apiKey,
    discoveryDocs:['https://www.googleapis.com/discovery/v2/apis/calendar/v3/rest']});
}
function gConnect(){
  if(!DB.settings.clientId||!DB.settings.apiKey){toast('先にクライアントIDとAPIキーを保存してください');return;}
  if(!gapiReady||!gisReady){toast('Google読込中…数秒後に再度お試しください');loadGoogle();return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:DB.settings.clientId,
    scope:'https://www.googleapis.com/auth/calendar',
    callback:async(resp)=>{
      if(resp.error){toast('認証に失敗しました');return;}
      gToken=resp;await gInitClient();updateGStatus();toast('Google連携しました ✅');
    }});
  tokenClient.requestAccessToken({prompt:gToken?'':'consent'});
}
function gConnected(){return !!gToken;}
function updateGStatus(){
  const dot=document.getElementById('gdot');
  if(dot)dot.textContent=gConnected()?'🟢':'';
  const s=document.getElementById('gStatus');
  if(s)s.innerHTML=gConnected()?'<span class="gstat on">接続済み</span>':'<span class="gstat off">未接続（オフラインで利用中）</span>';
}
async function maybePush(ev){if(gConnected()&&ev)gPush(ev);}
const COLOR_BY_TYPE=Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v.gcal]));
async function gPush(ev){
  if(!gConnected())return;
  try{
    const body={
      summary:`【${TYPES[ev.type].label}】${ev.title||''}`.trim(),
      colorId:COLOR_BY_TYPE[ev.type],
      start:ev.time?{dateTime:isoStart(ev),timeZone:'Asia/Tokyo'}:{date:ev.date},
      end:ev.time?{dateTime:isoEnd(ev),timeZone:'Asia/Tokyo'}:{date:addDays(ev.date,1)},
      extendedProperties:{private:{rokusoId:ev.id,rokusoType:ev.type}}
    };
    let res;
    if(ev.gid){res=await gapi.client.calendar.events.update({calendarId:DB.settings.calendarId,eventId:ev.gid,resource:body});}
    else{res=await gapi.client.calendar.events.insert({calendarId:DB.settings.calendarId,resource:body});
      ev.gid=res.result.id;save();}
  }catch(e){console.warn(e);}
}
async function gDelete(gid){if(!gConnected())return;try{await gapi.client.calendar.events.delete({calendarId:DB.settings.calendarId,eventId:gid});}catch(e){}}
function isoStart(ev){const hm=(ev.time.match(/(\d{1,2}):(\d{2})/)||[]);const h=hm[1]?pad(hm[1]):'09';const m=hm[2]||'00';return `${ev.date}T${h}:${m}:00`;}
function isoEnd(ev){const s=isoStart(ev);const d=new Date(s);d.setHours(d.getHours()+1);return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;}
async function gSyncAll(){
  if(!gConnected()){toast('先に接続してください');return;}
  toast('同期中…');for(const ev of DB.events){await gPush(ev);}toast('Googleへ同期しました ✅');updateGStatus();
}
async function gPull(){
  if(!gConnected()){toast('先に接続してください');return;}
  try{
    const T=new Date();const min=new Date(T);min.setMonth(min.getMonth()-1);const max=new Date(T);max.setMonth(max.getMonth()+3);
    const res=await gapi.client.calendar.events.list({calendarId:DB.settings.calendarId,
      timeMin:min.toISOString(),timeMax:max.toISOString(),singleEvents:true,maxResults:250,orderBy:'startTime'});
    let n=0;
    for(const g of (res.result.items||[])){
      const rid=g.extendedProperties?.private?.rokusoId;
      if(rid&&DB.events.find(e=>e.id===rid))continue; // already ours
      if(DB.events.find(e=>e.gid===g.id))continue;
      const type=guessType(g);
      const date=(g.start.date||g.start.dateTime||'').slice(0,10);if(!date)continue;
      const time=g.start.dateTime?g.start.dateTime.slice(11,16):'';
      DB.events.push({id:uid(),gid:g.id,type,title:(g.summary||'').replace(/^【.*?】/,'').trim(),date,time});n++;
    }
    save();render();toast(`${n}件を取り込みました`);
  }catch(e){console.warn(e);toast('取り込みに失敗しました');}
}
function guessType(g){
  const t=g.extendedProperties?.private?.rokusoType;if(t&&TYPES[t])return t;
  const byColor=Object.entries(COLOR_BY_TYPE).find(([k,v])=>v===g.colorId);if(byColor)return byColor[0];
  const s=(g.summary||'');
  if(/セミナー/.test(s))return'seminar';if(/復習/.test(s))return'review';
  if(/youtube|ユーチューブ|撮影|配信/i.test(s))return'youtube';if(/zoom|ズーム/i.test(s))return'zoom';
  return'treatment';
}

  document.getElementById('todayLabel').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`;}
setTodayLabel();
loadGoogle();
go('dash');
